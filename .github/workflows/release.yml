name: Release

# The only way @b9g/zen reaches npm - and CI can only STAGE, never make a
# version live.
#
# Trigger by publishing a GitHub Release, which creates the tag, or from
# Actions -> Release -> Run workflow. The job parks on the `npm` environment
# until a required reviewer approves it, then runs `libuild stage`: the version
# lands on the registry in a not-installable state, and only a human running
# `npm stage approve <id>` makes it live. That approval always prompts for 2FA,
# in the CLI and on the website, so no automation can do it.
#
# Restrict this repo's npm trusted publisher to the `npm stage publish` action
# only. Without that, CI regains the ability to publish directly.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    # The same databases as ci.yml, so the last gate before a version reaches
    # npm covers every dialect rather than SQLite alone. Kept in step with
    # docker-compose.yml; GitHub Actions has no YAML anchors to share it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U testuser -d test_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 15432:5432

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd "mysqladmin ping -h localhost -utestuser -ptestpass"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 13306:3306

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node 22, not 24 as the other repositories use. better-sqlite3 is pinned
      # to ^11, which predates node 24: its Database destructor runs after the
      # environment is torn down and aborts the process with "Assertion failed:
      # (env) != nullptr" once the tests have passed. Supporting node 24 means
      # widening the better-sqlite3 peer range, which is a consumer-facing
      # decision rather than a CI fix.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+, and staged publishing 11.15.0+
      # (libuild stage checks and says so). libuild spawns `npm`, so the
      # upgraded binary has to be the one on PATH.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: npm run build

      - name: Check every dialect is reachable
        run: node .github/scripts/check-dialects.js

      # The same script a human runs locally, so CI cannot drift from the
      # command you debug with.
      - run: npm test

      # A mistyped tag would otherwise stage whatever the manifest says, and
      # the GitHub Release would then claim a version npm never received.
      - name: Check the tag matches the version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG"
            exit 1
          fi

      - run: npx libuild stage --provenance
